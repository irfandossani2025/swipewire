; Per-directory PHP settings read by PHP-FPM on the Plesk host (user_ini.filename).
; Allows admins to upload large private product bundles (StoreProductFileRequest max: 500 MB).
; PHP re-reads this file every user_ini.cache_ttl seconds (300 by default).
upload_max_filesize = 256M
post_max_size = 260M
max_input_time = 300
max_execution_time = 120
